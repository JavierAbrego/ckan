name: release

# Publica binarios y un .deb cada vez que se empuja un tag vX.Y.Z.
# Cada plataforma se compila en su propio SO nativo (no cross-compile),
# salvo macOS Intel, que se cruza desde el runner Apple Silicon.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # necesario para crear el Release y subir assets

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            deb: true
          - os: macos-14 # Apple Silicon nativo
            target: aarch64-apple-darwin
          - os: macos-14 # Intel, cruzado desde el runner ARM
            target: x86_64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package tarball
        shell: bash
        run: |
          set -euo pipefail
          bin=target/${{ matrix.target }}/release/ckan
          name="ckan-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "$bin" "dist/$name/"
          cp README.md LICENSE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          # Checksum junto al artefacto, para la formula de Homebrew.
          ( cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256" )

      - name: Build .deb
        if: matrix.deb
        shell: bash
        run: |
          set -euo pipefail
          cargo install cargo-deb --locked
          # cargo-deb reempaqueta el binario ya compilado para este target.
          cargo deb --no-build --target ${{ matrix.target }}
          mkdir -p dist
          cp target/${{ matrix.target }}/debian/*.deb dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/*.deb

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
            dist/*.deb
          generate_release_notes: true
